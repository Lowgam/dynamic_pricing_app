<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Products list</title>
    <link rel="stylesheet" href="/static/style.css">
    
</head>
<body>
    <h1>Products list</h1>

    <div style="margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap">
        <a href="/simulate-prices-ui"
           style="padding: 8px 12px; background:#2b7a78; color:white; border-radius:6px; text-decoration:none; font-size:0.9rem;">
            Simulate prices from DB
        </a>

        <a href="/simulate-prices-mock-ui"
           style="padding: 8px 12px; background:#555; color:white; border-radius:6px; text-decoration:none; font-size:0.9rem;">
            Simulate prices from Shopify Mock
        </a>
    </div>

    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Prezzo</th>
            </tr>
        </thead>
        <tbody>
            <!-- also a for in the brackets is a placeholder -->
            {% for product in products %}
            <tr>
                <!-- {{ xxx }} are placeholders that will be fulfilled by jinja -->
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
